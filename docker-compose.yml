services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/certs:/certs:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./traefik/traefik.yml:/traefik.yml
    labels:
      # Enable self‑routing
      - "traefik.enable=true"
      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=dashboard"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
    environment:
      - DOMAIN=${DOMAIN}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  tp1-db:
    image: camilagea/tp1-db:1.0.0
    container_name: tp1-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - proxy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  tp1-api-clientes:
    image: camilagea/tp1-api-clientes:1.0.0
    container_name: tp1-api-clientes
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_CLIENTES}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=8081
    networks:
      - proxy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clientes.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/clientes`)"
      - "traefik.http.routers.clientes.entrypoints=websecure"
      - "traefik.http.routers.clientes.tls=true"
      - "traefik.http.services.clientes.loadbalancer.server.port=8081"
      # Remove only /api
      - "traefik.http.middlewares.clientes-strip.stripprefix.prefixes=/api"
      # Attach middleware
      - "traefik.http.routers.clientes.middlewares=clientes-strip"
    depends_on:
      - tp1-db
  
  tp1-web:
    image: castilloabel/tp1-web:1.0.0
    container_name: tp1-web
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tp1-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.tp1-web.entrypoints=websecure"
      - "traefik.http.routers.tp1-web.tls=true"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  tp1-api-transacciones:
    image: castilloabel/tp1-api-transacciones:2.0.0
    container_name: tp1-api-transacciones
    ports:
      - "8084:8084"
    networks:
      - proxy
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_TRANSACCIONES}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - IPAPI_TOKEN=${IPAPI_TOKEN}
      - PORT=8084
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transacciones.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/transacciones`)"
      - "traefik.http.routers.transacciones.entrypoints=websecure"
      - "traefik.http.routers.transacciones.tls=true"
      - "traefik.http.services.transacciones.loadbalancer.server.port=8084"
      # Remove only /api
      - "traefik.http.middlewares.transacciones-strip.stripprefix.prefixes=/api"
      # Attach middleware
      - "traefik.http.routers.transacciones.middlewares=transacciones-strip"
    depends_on:
      - tp1-db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  tp1-api-facturas:
    image: castilloabel/tp1-api-facturas:1.1.0
    container_name: tp1-api-facturas
    ports:
      - "8083:8083"
    networks:
      - proxy
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_FACTURAS}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=8083
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.facturas.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/facturas`)"
      - "traefik.http.routers.facturas.entrypoints=websecure"
      - "traefik.http.routers.facturas.tls=true"
      - "traefik.http.services.facturas.loadbalancer.server.port=8083"
      # Remove only /api
      - "traefik.http.middlewares.facturas-strip.stripprefix.prefixes=/api"
      # Attach middleware
      - "traefik.http.routers.facturas.middlewares=facturas-strip"
    depends_on:
      - tp1-db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
  
  tp1-api-tarjetas:
    image: castilloabel/tp1-api-tarjetas:1.1.0
    container_name: tp1-api-tarjetas
    ports:
      - "8085:8085"
    networks:
      - proxy
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_TARJETAS}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=8085
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tarjetas.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/tarjetas`)"
      - "traefik.http.routers.tarjetas.entrypoints=websecure"
      - "traefik.http.routers.tarjetas.tls=true"
      - "traefik.http.services.tarjetas.loadbalancer.server.port=8085"
      # Remove only /api
      - "traefik.http.middlewares.tarjetas-strip.stripprefix.prefixes=/api"
      # Attach middleware
      - "traefik.http.routers.tarjetas.middlewares=tarjetas-strip"
    depends_on:
      - tp1-db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  tp1-api-pagos:
    image: camilagea/tp1-api-pagos:1.0.0
    container_name: tp1-api-pagos
    ports:
      - "8082:8082"
    networks:
      - proxy
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_PAGOS}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=8082
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pagos.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/pagos`)"
      - "traefik.http.routers.pagos.entrypoints=websecure"
      - "traefik.http.routers.pagos.tls=true"
      - "traefik.http.services.pagos.loadbalancer.server.port=8082"
      - "traefik.http.middlewares.pagos-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.pagos.middlewares=pagos-strip"
    depends_on:
      - tp1-db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M


volumes:
  db_data:

networks:
  proxy:
    name: proxy