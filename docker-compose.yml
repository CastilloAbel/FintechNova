services:
  traefik:
    image: castilloabel/tp1-traefik:2.5.0
    container_name: traefik
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro
    environment:
      - DOMAIN=${DOMAIN}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  tp1-db:
    image: camilagea/tp1-db:1.0.0
    container_name: tp1-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - proxy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  tp1-api-clientes:
    image: camilagea/tp1-api-clientes:1.0.0
    container_name: tp1-api-clientes
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_CLIENTES}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - proxy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - tp1-db
  
  tp1-web:
    image: castilloabel/tp1-web:1.0.0
    container_name: tp1-web
    restart: always
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  tp1-api-transacciones:
    image: castilloabel/tp1-api-transacciones:2.0.0
    container_name: tp1-api-transacciones
    networks:
      - proxy
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_TRANSACCIONES}
      - IPAPI_TOKEN=${IPAPI_TOKEN}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - IPAPI_TOKEN=${IPAPI_TOKEN}
    depends_on:
      - tp1-db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  tp1-api-facturas:
    image: castilloabel/tp1-api-facturas:1.1.0
    container_name: tp1-api-facturas
    networks:
      - proxy
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_FACTURAS}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - tp1-db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
  
  tp1-api-tarjetas:
    image: castilloabel/tp1-api-tarjetas:1.1.0
    container_name: tp1-api-tarjetas
    networks:
      - proxy
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_TARJETAS}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - tp1-db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  tp1-api-pagos:
    image: camilagea/tp1-api-pagos:1.0.0
    container_name: tp1-api-pagos
    networks:
      - proxy
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_PAGOS}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - tp1-db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M


volumes:
  db_data:

networks:
  proxy:
    name: proxy