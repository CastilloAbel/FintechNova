services:
  db:
    image: camilagea/tp1-db:1.0.0
    container_name: tp1-db
    env_file:
      - ./aplicaciones-contenedores/db/.env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - fintech-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
  api-clientes:
    image: camilagea/tp1-api-clientes:1.0.0
    container_name: tp1-api-clientes
    env_file:
      - ./aplicaciones-contenedores/api-clientes/.env
    networks:
      - fintech-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M



volumes:
  db_data:

networks:
  fintech-network: