stages:
  - test
  - build
  - security
  - deploy

variables:
  ALUMNO: devops-grupo19
  DOCKER_NETWORK: proxy
  RUNNER_TAG: runner-without-dind
  BUILD_RUNNER_TAG: runner-without-dind
  DEPLOY_RUNNER_TAG: ssh-docker-alumnos01
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

prueba_pipeline:
  stage: test
  tags: [$RUNNER_TAG]
  script:
    - echo "Iniciando pipeline de FinTech Nova"
    - echo "GitLab CI/CD funciona correctamente"

validar_compose:
  stage: security
  image: docker:29.8.1-cli
  tags: [$RUNNER_TAG]
  script:
    - echo "Validando docker-compose.yml"
    - docker compose config --no-interpolate --quiet
    - echo "Docker Compose validado correctamente"

.build_image:
  stage: build
  image: docker:29.8.1-cli
  tags: [$BUILD_RUNNER_TAG]
  script:
    - test -n "$CI_REGISTRY" || { echo "CI_REGISTRY vacío"; exit 1; }
    - test -n "$CI_PROJECT_PATH" || { echo "CI_PROJECT_PATH vacío"; exit 1; }
    - export IMAGE_REF="$CI_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME"
    - echo "Construyendo y publicando $IMAGE_REF:$IMAGE_TAG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull --platform linux/amd64 -t "$IMAGE_REF:$IMAGE_TAG" -t "$IMAGE_REF:latest" -f "$DOCKERFILE" "$BUILD_CONTEXT"
    - docker push "$IMAGE_REF:$IMAGE_TAG"
    - docker push "$IMAGE_REF:latest"

build_traefik:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-traefik
    DOCKERFILE: traefik/Dockerfile
    BUILD_CONTEXT: traefik

build_db:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-db
    DOCKERFILE: aplicaciones-contenedores/db/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores/db

build_clientes:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-clientes
    DOCKERFILE: aplicaciones-contenedores/api-clientes/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores/api-clientes

build_pagos:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-pagos
    DOCKERFILE: aplicaciones-contenedores/api-pagos/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores/api-pagos

build_facturas:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-facturas
    DOCKERFILE: aplicaciones-contenedores/api-facturas/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores

build_tarjetas:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-tarjetas
    DOCKERFILE: aplicaciones-contenedores/api-tarjetas/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores

build_transacciones:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-transacciones
    DOCKERFILE: aplicaciones-contenedores/api-transacciones/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores

build_web:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-web
    DOCKERFILE: aplicaciones-contenedores/web/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores

analizar_dockerfiles:
  stage: security
  image: hadolint/hadolint:latest-debian
  tags: [$RUNNER_TAG]
  script:
    - echo "Analizando Dockerfiles de FinTech Nova"
    - |
      dockerfiles=""
      for dockerfile in \
        traefik/Dockerfile \
        aplicaciones-contenedores/db/Dockerfile \
        aplicaciones-contenedores/api-clientes/Dockerfile \
        aplicaciones-contenedores/api-pagos/Dockerfile \
        aplicaciones-contenedores/api-facturas/Dockerfile \
        aplicaciones-contenedores/api-tarjetas/Dockerfile \
        aplicaciones-contenedores/api-transacciones/Dockerfile \
        aplicaciones-contenedores/web/Dockerfile; do
        test -f "$dockerfile" || { echo "Falta $dockerfile"; exit 1; }
        dockerfiles="$dockerfiles $dockerfile"
      done
      hadolint --failure-threshold error $dockerfiles > hadolint-report.txt
      cat hadolint-report.txt
    - echo "Analisis de Dockerfiles finalizado"
  artifacts:
    when: always
    paths:
      - hadolint-report.txt
    expire_in: 1 week

analizar_codigo_semgrep:
  stage: security
  image: semgrep/semgrep:latest
  tags: [$RUNNER_TAG]
  script:
    - semgrep --config auto --severity ERROR --json --output semgrep-report.json --error . || status=$?
    - test -s semgrep-report.json
    - exit "${status:-0}"
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

analizar_imagenes_trivy:
  stage: security
  allow_failure: true
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags: [$RUNNER_TAG]
  script:
    - test -n "$CI_REGISTRY" || { echo "CI_REGISTRY vacío"; exit 1; }
    - test -n "$CI_PROJECT_PATH" || { echo "CI_PROJECT_PATH vacío"; exit 1; }
    - export IMAGE_REF="$CI_REGISTRY/$CI_PROJECT_PATH"
    - export TRIVY_USERNAME="$CI_REGISTRY_USER"
    - export TRIVY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - status=0
    - |
      for image in tp1-traefik tp1-db tp1-api-clientes tp1-api-pagos tp1-api-facturas tp1-api-tarjetas tp1-api-transacciones tp1-web; do
        trivy image \
          --username "$TRIVY_USERNAME" \
          --password "$TRIVY_PASSWORD" \
          --format json \
          --output "trivy-report-$image.json" \
          --exit-code 1 \
          --ignore-unfixed \
          --severity HIGH,CRITICAL \
          "$IMAGE_REF/$image:$IMAGE_TAG" || status=$?
      done
    - exit "$status"
  artifacts:
    when: always
    paths:
      - trivy-report-*.json
    expire_in: 1 week

analizar_archivos_yaml:
  stage: security
  image:
    name: cytopia/yamllint:latest
    entrypoint: [""]
  tags: [$RUNNER_TAG]
  script:
    - 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .gitlab-ci.yml docker-compose.yml traefik > yamllint-report.txt'
    - cat yamllint-report.txt
  artifacts:
    when: always
    paths:
      - yamllint-report.txt
    expire_in: 1 week

detectar_secretos:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  tags: [$RUNNER_TAG]
  script:
    - gitleaks detect --source . --redact --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

deploy_aws:
  stage: deploy
  image: docker:29.8.1-cli
  tags:
    - runner-without-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "feature/deploy-aws"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "feature/test-deploy-ec2"'
      when: manual
  allow_failure: true

  before_script:
    - apk add --no-cache openssh-client openssl apache2-utils python3
    - test -n "$DB_USER"
    - test -n "$DB_PASSWORD"
    - test -n "$MYSQL_ROOT_PASSWORD"
    - test -n "$DASHBOARD_USER"
    - test -n "$DASHBOARD_PASSWORD"
    - test -n "$AWS_EC2_HOST"
    - test -n "$AWS_EC2_USER"
    - test -s "$AWS_SSH_PRIVATE_KEY"
    - test -n "$CI_REGISTRY"
    - test -n "$CI_REGISTRY_USER"
    - test -n "$CI_REGISTRY_PASSWORD"
    - chmod 600 "$AWS_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -T 10 -H "$AWS_EC2_HOST" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

  script:
    - |
      set -eu
      set -o pipefail

      echo "Preparando Docker y Docker Compose en EC2..."

      scp -o BatchMode=yes -i "$AWS_SSH_PRIVATE_KEY" \
        setup-ec2.sh \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/setup-ec2.sh"

      ssh -o BatchMode=yes -o ConnectTimeout=10 \
        -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "bash ~/setup-ec2.sh"

      echo "Iniciando sesion en el Registry..."
      export DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT

      printf '%s' "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

      echo "Transfiriendo las 8 imagenes a EC2..."

      for IMAGE_NAME in \
        tp1-traefik \
        tp1-db \
        tp1-api-clientes \
        tp1-api-pagos \
        tp1-api-facturas \
        tp1-api-tarjetas \
        tp1-api-transacciones \
        tp1-web
      do
        IMAGE_REF="$CI_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME:$IMAGE_TAG"

        echo "Descargando $IMAGE_NAME..."
        docker pull "$IMAGE_REF"

        echo "Enviando $IMAGE_NAME a EC2..."
        docker save "$IMAGE_REF" |
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i "$AWS_SSH_PRIVATE_KEY" \
            "$AWS_EC2_USER@$AWS_EC2_HOST" \
            "sudo docker load"

        echo "$IMAGE_NAME transferida correctamente"
      done

      echo "Verificando imagenes en EC2..."
      ssh -o BatchMode=yes -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "sudo docker image ls"

      echo "Las 8 imagenes fueron transferidas a EC2"
      echo "Preparando directorio de despliegue..."
      ssh -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "mkdir -p ~/fintech-nova/certs ~/fintech-nova/secrets"

      echo "Copiando archivos de despliegue..."
      scp -i "$AWS_SSH_PRIVATE_KEY" \
        docker-compose.yml deploy.sh \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/fintech-nova/"

      echo "Preparando variables de entorno..."
      export DOCKER_USER="$CI_REGISTRY/$CI_PROJECT_PATH"
      export DOMAIN="$AWS_EC2_HOST"
      export DB_HOST="tp1-db"
      export DB_PORT="3306"
      export MYSQL_DATABASE="fintech_nova"
      export DB_NAME_CLIENTES="db_clientes"
      export DB_NAME_PAGOS="db_pagos"
      export DB_NAME_FACTURAS="db_facturas"
      export DB_NAME_TARJETAS="db_tarjetas"
      export DB_NAME_TRANSACCIONES="db_transacciones"

      python3 - <<'PY' > deployment.env
      import os

      keys = [
          "DOCKER_USER", "IMAGE_TAG", "DOMAIN",
          "DB_HOST", "DB_PORT", "DB_USER", "DB_PASSWORD",
          "MYSQL_ROOT_PASSWORD", "MYSQL_DATABASE",
          "DB_NAME_CLIENTES", "DB_NAME_PAGOS",
          "DB_NAME_FACTURAS", "DB_NAME_TARJETAS",
          "DB_NAME_TRANSACCIONES", "IPAPI_TOKEN"
      ]

      defaults = {
          "DB_HOST": "tp1-db",
          "DB_PORT": "3306",
          "MYSQL_DATABASE": "fintech_nova",
          "DB_NAME_CLIENTES": "db_clientes",
          "DB_NAME_PAGOS": "db_pagos",
          "DB_NAME_FACTURAS": "db_facturas",
          "DB_NAME_TARJETAS": "db_tarjetas",
          "DB_NAME_TRANSACCIONES": "db_transacciones"
      }

      for key in keys:
          value = os.environ.get(key, defaults.get(key, ""))
          if "\n" in value or "\r" in value:
              raise ValueError(f"Valor invalido para {key}")
          print(f"{key}={value}")
      PY

      chmod 600 deployment.env

      scp -i "$AWS_SSH_PRIVATE_KEY" \
        deployment.env \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/fintech-nova/.env"

      rm -f deployment.env

      echo "Preparando autenticacion del dashboard..."
      printf '%s\n' "$DASHBOARD_PASSWORD" |
        htpasswd -B -i -c dashboard_users "$DASHBOARD_USER"

      # Copiar primero a un archivo temporal que pertenece a ec2-user.
      scp -i "$AWS_SSH_PRIVATE_KEY" \
        dashboard_users \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/dashboard_users.tmp"

      # Moverlo al directorio definitivo con los permisos adecuados.
      ssh -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "sudo install -o 65532 -g 0 -m 640 ~/dashboard_users.tmp ~/fintech-nova/secrets/dashboard_users && rm -f ~/dashboard_users.tmp"

      rm -f dashboard_users

      echo "Generando certificado HTTPS..."
      openssl req -x509 -nodes -newkey rsa:2048 \
        -keyout local.key \
        -out local.crt \
        -days 365 \
        -subj "/CN=$AWS_EC2_HOST" \
        -addext "subjectAltName=IP:$AWS_EC2_HOST"

      scp -i "$AWS_SSH_PRIVATE_KEY" \
        local.crt local.key \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/fintech-nova/certs/"

      rm -f local.crt local.key

      echo "Iniciando contenedores en AWS..."
      ssh -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "cd ~/fintech-nova && chmod 600 .env certs/local.key && chmod +x deploy.sh && ./deploy.sh"
        