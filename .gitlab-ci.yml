stages:
  - test
  - build
  - security
  - deploy

variables:
  ALUMNO: devops-grupo19
  DOCKER_NETWORK: proxy
  RUNNER_TAG: runner-without-dind
  BUILD_RUNNER_TAG: runner-without-dind
  DEPLOY_RUNNER_TAG: ssh-docker-alumnos01
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  AWS_EC2_AMI_ID: "ami-0c230065b91270bc6"

prueba_pipeline:
  stage: test
  tags: [$RUNNER_TAG]
  script:
    - echo "Iniciando pipeline de FinTech Nova"
    - echo "GitLab CI/CD funciona correctamente"

validar_terraform:
  stage: test
  image:
    name: hashicorp/terraform:1.17.1
    entrypoint: [""]
  tags: [$RUNNER_TAG]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "deploy/terraform"'
  before_script:
    - apk add --no-cache ca-certificates
  script:
    - terraform fmt -check -recursive infra
    - terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
    - terraform -chdir=infra/aws validate

validar_compose:
  stage: security
  image: docker:29.8.1-cli
  tags: [$RUNNER_TAG]
  script:
    - echo "Validando docker-compose.yml"
    - docker compose config --no-interpolate --quiet
    - echo "Docker Compose validado correctamente"

.build_image:
  stage: build
  image: docker:29.8.1-cli
  tags: [$BUILD_RUNNER_TAG]
  script:
    - test -n "$CI_REGISTRY" || { echo "CI_REGISTRY vacío"; exit 1; }
    - test -n "$CI_PROJECT_PATH" || { echo "CI_PROJECT_PATH vacío"; exit 1; }
    - export IMAGE_REF="$CI_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME"
    - echo "Construyendo y publicando $IMAGE_REF:$IMAGE_TAG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull --platform linux/amd64 -t "$IMAGE_REF:$IMAGE_TAG" -t "$IMAGE_REF:latest" -f "$DOCKERFILE" "$BUILD_CONTEXT"
    - docker push "$IMAGE_REF:$IMAGE_TAG"
    - docker push "$IMAGE_REF:latest"

build_traefik:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-traefik
    DOCKERFILE: traefik/Dockerfile
    BUILD_CONTEXT: traefik

build_db:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-db
    DOCKERFILE: aplicaciones-contenedores/db/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores/db

build_clientes:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-clientes
    DOCKERFILE: aplicaciones-contenedores/api-clientes/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores/api-clientes

build_pagos:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-pagos
    DOCKERFILE: aplicaciones-contenedores/api-pagos/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores/api-pagos

build_facturas:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-facturas
    DOCKERFILE: aplicaciones-contenedores/api-facturas/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores

build_tarjetas:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-tarjetas
    DOCKERFILE: aplicaciones-contenedores/api-tarjetas/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores

build_transacciones:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-api-transacciones
    DOCKERFILE: aplicaciones-contenedores/api-transacciones/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores

build_web:
  extends: .build_image
  variables:
    BUILD_RUNNER_TAG: runner-without-dind
    IMAGE_NAME: tp1-web
    DOCKERFILE: aplicaciones-contenedores/web/Dockerfile
    BUILD_CONTEXT: aplicaciones-contenedores

analizar_dockerfiles:
  stage: security
  image: hadolint/hadolint:latest-debian
  tags: [$RUNNER_TAG]
  script:
    - echo "Analizando Dockerfiles de FinTech Nova"
    - |
      dockerfiles=""
      for dockerfile in \
        traefik/Dockerfile \
        aplicaciones-contenedores/db/Dockerfile \
        aplicaciones-contenedores/api-clientes/Dockerfile \
        aplicaciones-contenedores/api-pagos/Dockerfile \
        aplicaciones-contenedores/api-facturas/Dockerfile \
        aplicaciones-contenedores/api-tarjetas/Dockerfile \
        aplicaciones-contenedores/api-transacciones/Dockerfile \
        aplicaciones-contenedores/web/Dockerfile; do
        test -f "$dockerfile" || { echo "Falta $dockerfile"; exit 1; }
        dockerfiles="$dockerfiles $dockerfile"
      done
      hadolint --failure-threshold error $dockerfiles > hadolint-report.txt
      cat hadolint-report.txt
    - echo "Analisis de Dockerfiles finalizado"
  artifacts:
    when: always
    paths:
      - hadolint-report.txt
    expire_in: 1 week

analizar_codigo_semgrep:
  stage: security
  image: semgrep/semgrep:latest
  tags: [$RUNNER_TAG]
  script:
    - semgrep --config auto --severity ERROR --json --output semgrep-report.json --error . || status=$?
    - test -s semgrep-report.json
    - exit "${status:-0}"
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

analizar_imagenes_trivy:
  stage: security
  allow_failure: true
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags: [$RUNNER_TAG]
  script:
    - test -n "$CI_REGISTRY" || { echo "CI_REGISTRY vacío"; exit 1; }
    - test -n "$CI_PROJECT_PATH" || { echo "CI_PROJECT_PATH vacío"; exit 1; }
    - export IMAGE_REF="$CI_REGISTRY/$CI_PROJECT_PATH"
    - export TRIVY_USERNAME="$CI_REGISTRY_USER"
    - export TRIVY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - status=0
    - |
      for image in tp1-traefik tp1-db tp1-api-clientes tp1-api-pagos tp1-api-facturas tp1-api-tarjetas tp1-api-transacciones tp1-web; do
        trivy image \
          --username "$TRIVY_USERNAME" \
          --password "$TRIVY_PASSWORD" \
          --format json \
          --output "trivy-report-$image.json" \
          --exit-code 1 \
          --ignore-unfixed \
          --severity HIGH,CRITICAL \
          "$IMAGE_REF/$image:$IMAGE_TAG" || status=$?
      done
    - exit "$status"
  artifacts:
    when: always
    paths:
      - trivy-report-*.json
    expire_in: 1 week

analizar_archivos_yaml:
  stage: security
  image:
    name: cytopia/yamllint:latest
    entrypoint: [""]
  tags: [$RUNNER_TAG]
  script:
    - 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .gitlab-ci.yml docker-compose.yml traefik > yamllint-report.txt'
    - cat yamllint-report.txt
  artifacts:
    when: always
    paths:
      - yamllint-report.txt
    expire_in: 1 week

detectar_secretos:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  tags: [$RUNNER_TAG]
  script:
    - gitleaks detect --source . --redact --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

deploy_aws:
  stage: deploy
  image: docker:29.8.1-cli
  tags:
    - runner-without-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "feature/deploy-aws"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "feature/test-deploy-ec2"'
      when: manual
  allow_failure: true

  before_script:
    - apk add --no-cache openssh-client openssl apache2-utils python3
    - test -n "$DB_USER"
    - test -n "$DB_PASSWORD"
    - test -n "$MYSQL_ROOT_PASSWORD"
    - test -n "$DASHBOARD_USER"
    - test -n "$DASHBOARD_PASSWORD"
    - test -n "$AWS_EC2_HOST"
    - test -n "$AWS_EC2_USER"
    - test -s "$AWS_SSH_PRIVATE_KEY"
    - test -n "$CI_REGISTRY"
    - test -n "$CI_REGISTRY_USER"
    - test -n "$CI_REGISTRY_PASSWORD"
    - chmod 600 "$AWS_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -T 10 -H "$AWS_EC2_HOST" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

  script:
    - |
      set -eu
      set -o pipefail
      umask 077

      DEPLOY_TMP_DIR="$(mktemp -d)"
      export DOCKER_CONFIG="$DEPLOY_TMP_DIR/docker"
      mkdir -p "$DOCKER_CONFIG"
      cleanup() {
        rm -rf -- "$DEPLOY_TMP_DIR"
      }
      trap cleanup EXIT
      trap 'exit 1' HUP INT TERM

      echo "Preparando Docker y Docker Compose en EC2..."

      scp -o BatchMode=yes -i "$AWS_SSH_PRIVATE_KEY" \
        setup-ec2.sh \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/setup-ec2.sh"

      ssh -o BatchMode=yes -o ConnectTimeout=10 \
        -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "bash ~/setup-ec2.sh"

      echo "Iniciando sesion en el Registry..."
      printf '%s' "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

      echo "Transfiriendo las 8 imagenes a EC2..."

      for IMAGE_NAME in \
        tp1-traefik \
        tp1-db \
        tp1-api-clientes \
        tp1-api-pagos \
        tp1-api-facturas \
        tp1-api-tarjetas \
        tp1-api-transacciones \
        tp1-web
      do
        IMAGE_REF="$CI_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME:$IMAGE_TAG"

        echo "Descargando $IMAGE_NAME..."
        docker pull "$IMAGE_REF"

        echo "Enviando $IMAGE_NAME a EC2..."
        docker save "$IMAGE_REF" |
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i "$AWS_SSH_PRIVATE_KEY" \
            "$AWS_EC2_USER@$AWS_EC2_HOST" \
            "sudo docker load"

        echo "$IMAGE_NAME transferida correctamente"
      done

      echo "Verificando imagenes en EC2..."
      ssh -o BatchMode=yes -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "sudo docker image ls"

      echo "Las 8 imagenes fueron transferidas a EC2"
      echo "Preparando directorio de despliegue..."
      ssh -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "mkdir -p ~/fintech-nova/certs ~/fintech-nova/secrets"

      echo "Copiando archivos de despliegue..."
      scp -i "$AWS_SSH_PRIVATE_KEY" \
        docker-compose.yml deploy.sh \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/fintech-nova/"

      echo "Preparando variables de entorno..."
      export DOCKER_USER="$CI_REGISTRY/$CI_PROJECT_PATH"
      export DOMAIN="$AWS_EC2_HOST"
      export DB_HOST="tp1-db"
      export DB_PORT="3306"
      export MYSQL_DATABASE="fintech_nova"
      export DB_NAME_CLIENTES="db_clientes"
      export DB_NAME_PAGOS="db_pagos"
      export DB_NAME_FACTURAS="db_facturas"
      export DB_NAME_TARJETAS="db_tarjetas"
      export DB_NAME_TRANSACCIONES="db_transacciones"

      python3 - <<'PY' > "$DEPLOY_TMP_DIR/deployment.env"
      import os

      keys = [
          "DOCKER_USER", "IMAGE_TAG", "DOMAIN",
          "DB_HOST", "DB_PORT", "DB_USER", "DB_PASSWORD",
          "MYSQL_ROOT_PASSWORD", "MYSQL_DATABASE",
          "DB_NAME_CLIENTES", "DB_NAME_PAGOS",
          "DB_NAME_FACTURAS", "DB_NAME_TARJETAS",
          "DB_NAME_TRANSACCIONES", "IPAPI_TOKEN"
      ]

      defaults = {
          "DB_HOST": "tp1-db",
          "DB_PORT": "3306",
          "MYSQL_DATABASE": "fintech_nova",
          "DB_NAME_CLIENTES": "db_clientes",
          "DB_NAME_PAGOS": "db_pagos",
          "DB_NAME_FACTURAS": "db_facturas",
          "DB_NAME_TARJETAS": "db_tarjetas",
          "DB_NAME_TRANSACCIONES": "db_transacciones"
      }

      for key in keys:
          value = os.environ.get(key, defaults.get(key, ""))
          if "\n" in value or "\r" in value:
              raise ValueError(f"Valor invalido para {key}")
          print(f"{key}={value}")
      PY

      chmod 600 "$DEPLOY_TMP_DIR/deployment.env"

      scp -i "$AWS_SSH_PRIVATE_KEY" \
        "$DEPLOY_TMP_DIR/deployment.env" \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/fintech-nova/.env"

      echo "Preparando autenticacion del dashboard..."
      printf '%s\n' "$DASHBOARD_PASSWORD" |
        htpasswd -B -i -c "$DEPLOY_TMP_DIR/dashboard_users" "$DASHBOARD_USER"

      scp -i "$AWS_SSH_PRIVATE_KEY" \
        "$DEPLOY_TMP_DIR/dashboard_users" \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/dashboard_users.tmp"

      ssh -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "sudo install -o 65532 -g 0 -m 640 ~/dashboard_users.tmp ~/fintech-nova/secrets/dashboard_users && rm -f ~/dashboard_users.tmp"

      echo "Generando certificado HTTPS..."
      openssl req -x509 -nodes -newkey rsa:2048 \
        -keyout "$DEPLOY_TMP_DIR/local.key" \
        -out "$DEPLOY_TMP_DIR/local.crt" \
        -days 365 \
        -subj "/CN=$AWS_EC2_HOST" \
        -addext "subjectAltName=IP:$AWS_EC2_HOST"

      scp -i "$AWS_SSH_PRIVATE_KEY" \
        "$DEPLOY_TMP_DIR/local.crt" "$DEPLOY_TMP_DIR/local.key" \
        "$AWS_EC2_USER@$AWS_EC2_HOST:~/fintech-nova/certs/"

      echo "Iniciando contenedores en AWS..."
      ssh -i "$AWS_SSH_PRIVATE_KEY" \
        "$AWS_EC2_USER@$AWS_EC2_HOST" \
        "cd ~/fintech-nova && chmod 600 .env certs/local.key && chmod +x deploy.sh && ./deploy.sh"

      echo "Despliegue legacy verificado correctamente."
      echo "Aplicacion: https://$AWS_EC2_HOST/"
      echo "Dashboard: https://$AWS_EC2_HOST/dashboard/"

deploy_terraform:
  stage: deploy
  image:
    name: hashicorp/terraform:1.17.1
    entrypoint: [""]
  tags:
    - runner-without-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "deploy/terraform"'
      when: manual
  allow_failure: true
  resource_group: aws-sandbox
  environment:
    name: aws-sandbox

  before_script:
    - apk add --no-cache ca-certificates docker-cli openssh-client openssl apache2-utils python3 bash coreutils
    - test -n "$DB_USER"
    - test -n "$DB_PASSWORD"
    - test -n "$MYSQL_ROOT_PASSWORD"
    - test -n "$DASHBOARD_USER"
    - test -n "$DASHBOARD_PASSWORD"
    - test -n "$AWS_ACCESS_KEY_ID"
    - test -n "$AWS_SECRET_ACCESS_KEY"
    - test -n "$AWS_SESSION_TOKEN"
    - test -n "$AWS_DEFAULT_REGION"
    - test -n "$RUNNER_EGRESS_CIDR"
    - test -n "$CI_REGISTRY"
    - test -n "$CI_REGISTRY_USER"
    - test -n "$CI_REGISTRY_PASSWORD"

  script:
    - |
      set -eu
      set -o pipefail
      umask 077

      export TF_USERNAME="$TF_STATE_USERNAME"
      export TF_PASSWORD="$TF_STATE_PASSWORD"
      export TF_HTTP_USERNAME="$TF_STATE_USERNAME"
      export TF_HTTP_PASSWORD="$TF_STATE_PASSWORD"
      export TF_HTTP_ADDRESS="$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/fintech-nova-sandbox"
      export TF_HTTP_LOCK_ADDRESS="$TF_HTTP_ADDRESS/lock"
      export TF_HTTP_UNLOCK_ADDRESS="$TF_HTTP_ADDRESS/lock"
      export TF_HTTP_LOCK_METHOD="POST"
      export TF_HTTP_UNLOCK_METHOD="DELETE"
      export TF_HTTP_RETRY_WAIT_MIN="5"

      TF_TMP_DIR="$(mktemp -d)"
      TF_SSH_DIR="$TF_TMP_DIR/ssh"
      export TF_DATA_DIR="$TF_TMP_DIR/terraform-data"
      export DOCKER_CONFIG="$TF_TMP_DIR/docker"
      mkdir -p "$TF_SSH_DIR" "$TF_DATA_DIR" "$DOCKER_CONFIG"
      cleanup() {
        rm -rf -- "$TF_TMP_DIR"
      }
      trap cleanup EXIT
      trap 'exit 1' HUP INT TERM

      TF_SSH_KEY="$TF_SSH_DIR/id_ed25519"
      ssh-keygen -q -t ed25519 -N "" \
        -C "gitlab-$CI_PROJECT_ID-$CI_PIPELINE_ID" \
        -f "$TF_SSH_KEY"

      export TF_VAR_aws_region="$AWS_DEFAULT_REGION"
      export TF_VAR_ami_id="$AWS_EC2_AMI_ID"
      RUNNER_SSH_CIDR="$(python3 - "$RUNNER_EGRESS_CIDR" <<'PY'
      import ipaddress
      import sys

      value = sys.argv[1].strip()
      if "/" not in value:
          value = f"{value}/32"

      try:
          network = ipaddress.ip_network(value, strict=False)
      except ValueError:
          raise SystemExit("RUNNER_EGRESS_CIDR debe ser una IP IPv4, con /32 opcional")

      if network.version != 4 or network.prefixlen != 32:
          raise SystemExit("RUNNER_EGRESS_CIDR debe ser una IP IPv4 individual (/32)")

      print(network.with_prefixlen)
      PY
      )"
      export TF_VAR_runner_ssh_cidr="$RUNNER_SSH_CIDR"
      export TF_VAR_resource_suffix="$CI_PIPELINE_ID"
      export TF_VAR_ssh_public_key="$(cat "$TF_SSH_KEY.pub")"

      echo "Validando y planificando la infraestructura AWS..."
      terraform -chdir=infra/aws init -input=false
      terraform -chdir=infra/aws validate
      terraform -chdir=infra/aws plan -input=false -out="$TF_TMP_DIR/deploy.tfplan"
      terraform -chdir=infra/aws apply -input=false -auto-approve "$TF_TMP_DIR/deploy.tfplan"

      AWS_EC2_HOST="$(terraform -chdir=infra/aws output -raw public_ip)"
      AWS_EC2_USER="$(terraform -chdir=infra/aws output -raw ssh_user)"
      export AWS_EC2_HOST AWS_EC2_USER

      echo "Esperando SSH en la nueva instancia EC2..."
      scan_attempt=0
      while [ "$scan_attempt" -lt 12 ]; do
        if ssh-keyscan -T 5 -H "$AWS_EC2_HOST" \
          > "$TF_SSH_DIR/known_hosts.tmp" 2>/dev/null \
          && [ -s "$TF_SSH_DIR/known_hosts.tmp" ]; then
          mv "$TF_SSH_DIR/known_hosts.tmp" "$TF_SSH_DIR/known_hosts"
          break
        fi
        scan_attempt=$((scan_attempt + 1))
        sleep 5
      done
      test -s "$TF_SSH_DIR/known_hosts" || {
        echo "No se pudo obtener la host key SSH de $AWS_EC2_HOST" >&2
        exit 1
      }
      cat > "$TF_SSH_DIR/ssh_config" <<EOF
      Host fintech-nova
        HostName $AWS_EC2_HOST
        User $AWS_EC2_USER
        IdentityFile $TF_SSH_KEY
        UserKnownHostsFile $TF_SSH_DIR/known_hosts
        StrictHostKeyChecking yes
        BatchMode yes
        ConnectTimeout 10
      EOF
      chmod 600 "$TF_SSH_DIR/ssh_config" "$TF_SSH_DIR/known_hosts" "$TF_SSH_KEY"

      echo "Preparando Docker y Docker Compose en EC2..."

      scp -F "$TF_SSH_DIR/ssh_config" \
        setup-ec2.sh \
        fintech-nova:~/setup-ec2.sh

      ssh -F "$TF_SSH_DIR/ssh_config" \
        fintech-nova \
        "bash ~/setup-ec2.sh"

      echo "Iniciando sesion en el Registry..."
      printf '%s' "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

      echo "Transfiriendo las 8 imagenes a EC2..."

      for IMAGE_NAME in \
        tp1-traefik \
        tp1-db \
        tp1-api-clientes \
        tp1-api-pagos \
        tp1-api-facturas \
        tp1-api-tarjetas \
        tp1-api-transacciones \
        tp1-web
      do
        IMAGE_REF="$CI_REGISTRY/$CI_PROJECT_PATH/$IMAGE_NAME:$IMAGE_TAG"

        echo "Descargando $IMAGE_NAME..."
        docker pull "$IMAGE_REF"

        echo "Enviando $IMAGE_NAME a EC2..."
        docker save "$IMAGE_REF" |
          ssh -F "$TF_SSH_DIR/ssh_config" \
            fintech-nova \
            "sudo docker load"

        echo "$IMAGE_NAME transferida correctamente"
      done

      echo "Verificando imagenes en EC2..."
      ssh -F "$TF_SSH_DIR/ssh_config" \
        fintech-nova \
        "sudo docker image ls"

      echo "Las 8 imagenes fueron transferidas a EC2"
      echo "Preparando directorio de despliegue..."
      ssh -F "$TF_SSH_DIR/ssh_config" \
        fintech-nova \
        "mkdir -p ~/fintech-nova/certs ~/fintech-nova/secrets"

      echo "Copiando archivos de despliegue..."
      scp -F "$TF_SSH_DIR/ssh_config" \
        docker-compose.yml deploy.sh \
        fintech-nova:~/fintech-nova/

      echo "Preparando variables de entorno..."
      export DOCKER_USER="$CI_REGISTRY/$CI_PROJECT_PATH"
      export DOMAIN="$AWS_EC2_HOST"
      export DB_HOST="tp1-db"
      export DB_PORT="3306"
      export MYSQL_DATABASE="fintech_nova"
      export DB_NAME_CLIENTES="db_clientes"
      export DB_NAME_PAGOS="db_pagos"
      export DB_NAME_FACTURAS="db_facturas"
      export DB_NAME_TARJETAS="db_tarjetas"
      export DB_NAME_TRANSACCIONES="db_transacciones"

      python3 - <<'PY' > "$TF_TMP_DIR/deployment.env"
      import os

      keys = [
          "DOCKER_USER", "IMAGE_TAG", "DOMAIN",
          "DB_HOST", "DB_PORT", "DB_USER", "DB_PASSWORD",
          "MYSQL_ROOT_PASSWORD", "MYSQL_DATABASE",
          "DB_NAME_CLIENTES", "DB_NAME_PAGOS",
          "DB_NAME_FACTURAS", "DB_NAME_TARJETAS",
          "DB_NAME_TRANSACCIONES", "IPAPI_TOKEN"
      ]

      defaults = {
          "DB_HOST": "tp1-db",
          "DB_PORT": "3306",
          "MYSQL_DATABASE": "fintech_nova",
          "DB_NAME_CLIENTES": "db_clientes",
          "DB_NAME_PAGOS": "db_pagos",
          "DB_NAME_FACTURAS": "db_facturas",
          "DB_NAME_TARJETAS": "db_tarjetas",
          "DB_NAME_TRANSACCIONES": "db_transacciones"
      }

      for key in keys:
          value = os.environ.get(key, defaults.get(key, ""))
          if "\n" in value or "\r" in value:
              raise ValueError(f"Valor invalido para {key}")
          print(f"{key}={value}")
      PY

      chmod 600 "$TF_TMP_DIR/deployment.env"

      scp -F "$TF_SSH_DIR/ssh_config" \
        "$TF_TMP_DIR/deployment.env" \
        fintech-nova:~/fintech-nova/.env

      echo "Preparando autenticacion del dashboard..."
      printf '%s\n' "$DASHBOARD_PASSWORD" |
        htpasswd -B -i -c "$TF_TMP_DIR/dashboard_users" "$DASHBOARD_USER"

      # Copiar primero a un archivo temporal que pertenece a ec2-user.
      scp -F "$TF_SSH_DIR/ssh_config" \
        "$TF_TMP_DIR/dashboard_users" \
        fintech-nova:~/dashboard_users.tmp

      # Moverlo al directorio definitivo con los permisos adecuados.
      ssh -F "$TF_SSH_DIR/ssh_config" \
        fintech-nova \
        "sudo install -o 65532 -g 0 -m 640 ~/dashboard_users.tmp ~/fintech-nova/secrets/dashboard_users && rm -f ~/dashboard_users.tmp"

      echo "Generando certificado HTTPS..."
      openssl req -x509 -nodes -newkey rsa:2048 \
        -keyout "$TF_TMP_DIR/local.key" \
        -out "$TF_TMP_DIR/local.crt" \
        -days 365 \
        -subj "/CN=$AWS_EC2_HOST" \
        -addext "subjectAltName=IP:$AWS_EC2_HOST"

      scp -F "$TF_SSH_DIR/ssh_config" \
        "$TF_TMP_DIR/local.crt" "$TF_TMP_DIR/local.key" \
        fintech-nova:~/fintech-nova/certs/

      echo "Iniciando contenedores en AWS..."
      ssh -F "$TF_SSH_DIR/ssh_config" \
        fintech-nova \
        "cd ~/fintech-nova && chmod 600 .env certs/local.key && chmod +x deploy.sh && ./deploy.sh"

      echo "Despliegue Terraform verificado correctamente."
      echo "Aplicacion: https://$AWS_EC2_HOST/"
      echo "Dashboard: https://$AWS_EC2_HOST/dashboard/"
