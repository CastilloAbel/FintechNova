stages:
  - test
  - build

prueba_pipeline:
  stage: test
  tags:
    - devops-runner
  script:
    - echo "Iniciando pipeline de FinTech Nova"
    - echo "GitLab CI/CD funciona correctamente"

validar_compose:
  stage: test
  image: docker:27-cli
  tags:
    - devops-runner
  script:
    - echo "Validando docker-compose.yml"
    - docker compose config --no-interpolate --quiet
    - echo "Docker Compose validado correctamente"

build_web:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  tags:
    - runner-without-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Construyendo imagen de FinTech Nova Web"
    - docker info
    - docker build -t tp1-web:prueba -f aplicaciones-contenedores/web/Dockerfile aplicaciones-contenedores
    - echo "Imagen web construida correctamente"

probar_docker:
  stage: test
  image: docker:27-cli
  tags:
    - devops-runner
  script:
    - echo "Comprobando acceso a Docker"
    - docker info